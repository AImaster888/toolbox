<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工務小幫手 Toolbox</title>
  <!-- 版本 v1.2.0 ／ 2026-08-22 -->


  <!-- Google Fonts：Noto Sans TC（正文）+ Space Mono（裝飾） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ===== 全域變數 ===== */
    :root {
      --bg: #F7F7F5;
      --card-bg: #FFFFFF;
      --text-primary: #1A1A1A;
      --text-secondary: #6B6B6B;
      --text-hint: #9B9B9B;
      --accent: #2563EB;
      --accent-light: #EFF6FF;
      --accent-hover: #1D4ED8;
      --border: #E5E5E3;
      --border-hover: #D1D1CF;
      --tag-bg: #F0F0EE;
      --tag-active-bg: #2563EB;
      --tag-active-text: #FFFFFF;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 12px;
      --radius-sm: 8px;
      --font-body: 'Noto Sans TC', -apple-system, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
      border-bottom: 1px solid #1E3A8A;
      padding: 2rem 1.5rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .site-title { flex: 1 1 0; white-space: nowrap; }

    .site-title {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .site-title span {
      color: #93C5FD;
    }

    .count-wrap {
      flex: 1 1 0;
      display: flex;
      justify-content: flex-end;
    }

    .tool-count {
      white-space: nowrap;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.15);
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
    }

    /* ===== 搜尋框（位於標題列） ===== */
    .search-box {
      position: relative;
      flex: 0 1 420px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-hint);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.75rem;
      font-size: 0.95rem;
      font-family: var(--font-body);
      border: 1px solid transparent;
      border-radius: 100px;
      background: #FFFFFF;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: #93C5FD;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25);
    }

    .search-input::placeholder { color: var(--text-hint); }

    /* ===== 分類標籤 ===== */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      padding: 0.35rem 0.9rem;
      font-size: 0.85rem;
      font-family: var(--font-body);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 100px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      user-select: none;
    }

    .tag:hover {
      border-color: #FFFFFF;
      background: rgba(255,255,255,0.18);
      color: #FFFFFF;
    }

    .tag.active {
      background: #FFFFFF;
      color: #1E3A8A;
      border-color: #FFFFFF;
      font-weight: 500;
    }

    /* ===== 主要內容 ===== */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* ===== 卡片網格 ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    /* ===== 卡片 ===== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card:hover::before {
      transform: scaleX(1);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--accent);
      background: var(--accent-light);
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      font-weight: 500;
    }

    .card-arrow {
      color: var(--text-hint);
      transition: transform 0.2s, color 0.2s;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* ===== Prompt 卡片（沒有連結、只有 prompt 的項目）===== */
    .card-prompt {
      font-family: inherit;
      font-size: inherit;
      text-align: left;
      border: 1px dashed var(--border-hover);
      cursor: pointer;
      width: 100%;
    }

    .card-prompt::before { background: #7C3AED; }

    .card-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      color: #7C3AED;
      background: #F5F3FF;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .card-prompt .card-title { padding-right: 4.5rem; }
    .card-prompt .card-category { color: #7C3AED; background: #F5F3FF; }
    .card-prompt:hover .card-arrow { transform: none; color: #7C3AED; }

    /* ===== Prompt 彈窗 ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.45);
      padding: 1.5rem;
      overflow-y: auto;
    }

    .modal.open { display: flex; align-items: center; justify-content: center; }

    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
      width: 100%;
      max-width: 720px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: fadeUp 0.25s ease both;
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-size: 1.05rem; font-weight: 700; line-height: 1.4; }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: var(--text-hint);
      cursor: pointer;
      padding: 0 0.25rem;
    }

    .modal-close:hover { color: var(--text-primary); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 1.25rem;
      font-family: var(--font-body);
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .btn-primary, .btn-ghost {
      font-family: var(--font-body);
      font-size: 0.9rem;
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      min-width: 8.5rem;
    }

    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-ghost {
      background: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text-primary); }

    /* ===== Loading 狀態 ===== */
    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-hint);
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 空狀態 ===== */
    .empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-hint);
    }

    .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    /* ===== 錯誤狀態 ===== */
    .error {
      text-align: center;
      padding: 3rem 1rem;
      color: #DC2626;
      background: #FEF2F2;
      border-radius: var(--radius);
      margin: 1rem 0;
    }

    /* ===== 免責聲明 ===== */
    .disclaimer {
      margin: 0 0 1rem;
      color: rgba(255,255,255,0.72);
      font-size: 0.75rem;
      line-height: 1.5;
    }

    /* ===== RWD ===== */
    @media (max-width: 600px) {
      .header { padding: 1.25rem 1rem 1rem; }
      .main { padding: 1rem; }
      .site-title { font-size: 1.25rem; }
      .header-top { flex-wrap: wrap; gap: 0.75rem; }
      .site-title { flex: 0 1 auto; }
      .search-box { flex: 1 1 100%; order: 3; }
      .grid { grid-template-columns: 1fr; }
      .modal { padding: 0.75rem; }
      .modal-box { max-height: 90vh; }
    }

    /* ===== 淡入動畫 ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeUp 0.4s ease both; }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <h1 class="site-title">工務小幫手<span> Toolbox</span></h1>

        <!-- 搜尋框 -->
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="搜尋工具名稱、說明或 prompt 內容...">
        </div>

        <div class="count-wrap"><span class="tool-count" id="toolCount">載入中...</span></div>
      </div>

      <!-- 免責聲明 -->
      <p class="disclaimer">本站為個人常用工具整理，僅供自用；內容不保證正確，請自行查證，作者不負任何責任，亦不提供支援。</p>

      <!-- 分類標籤（自動產生） -->
      <div class="tags" id="tagsContainer">
        <button class="tag active" data-category="all">全部</button>
      </div>
    </div>
  </header>

  <!-- ===== 主要內容 ===== -->
  <main class="main">
    <!-- Loading 狀態 -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>正在讀取工具清單...</p>
    </div>

    <!-- 卡片網格 -->
    <div class="grid" id="grid" style="display:none;"></div>

    <!-- 空狀態 -->
    <div class="empty" id="empty" style="display:none;">
      <div class="empty-icon">🔍</div>
      <p>找不到符合的工具</p>
    </div>

    <!-- 錯誤狀態 -->
    <div class="error" id="error" style="display:none;"></div>
  </main>

  <!-- ===== Prompt 彈窗 ===== -->
  <div class="modal" id="modal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button type="button" class="modal-close" data-close aria-label="關閉">&times;</button>
      </div>
      <pre class="modal-body" id="modalBody"></pre>
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close>關閉</button>
        <button type="button" class="btn-primary" id="copyBtn">複製 prompt</button>
      </div>
    </div>
  </div>

  <script>
    // =============================================================
    // 📌 設定區：只需要改這裡！
    // =============================================================
    // Google Sheets 資料來源。
    // 這裡用 gviz 查詢只取 A~G 欄（前端會用到的欄位），
    // 而不是整張表 export，避免把 H 欄以後的備份資料（例如 code 欄的原始碼）也下載下來。
    // 換試算表時只要改 SHEET_ID 和 SHEET_GID；欄位有增減再改 select 後面的欄位代號。
    const SHEET_ID  = '1Nm2Lo7xo-wjkt0LOq7SmJYqmmdmfS1HUXTZyVZ1YtWM';
    const SHEET_GID = '872940140';
    const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
      + `?tqx=out:csv&gid=${SHEET_GID}&headers=1&tq=${encodeURIComponent('select A,B,C,D,E,F,G')}`;

    // 欄位對應（照你的 Google Sheets 實際資料，從 0 開始）
    // A=id(0), B=名稱(1), C=說明(2), D=連結(3), E=分類(4), F=prompt(5), G=狀態(6)
    const COL = {
      ID: 0,       // A 欄：id
      NAME: 1,     // B 欄：名稱
      DESC: 2,     // C 欄：說明
      LINK: 3,     // D 欄：連結
      CATEGORY: 4, // E 欄：分類
      PROMPT: 5,   // F 欄：prompt（不顯示在前端）
      STATUS: 6    // G 欄：狀態（已完成）
    };

    // =============================================================
    // 以下不用修改
    // =============================================================

    // 全域狀態
    let allTools = [];
    let currentCategory = 'all';
    let currentSearch = '';

    // DOM 元素
    const grid = document.getElementById('grid');
    const loading = document.getElementById('loading');
    const empty = document.getElementById('empty');
    const error = document.getElementById('error');
    const tagsContainer = document.getElementById('tagsContainer');
    const toolCount = document.getElementById('toolCount');
    const searchInput = document.getElementById('searchInput');

    // ----- CSV 解析器（處理逗號在引號內的情況）-----
    function parseCSV(text) {
      const rows = [];
      let current = '';
      let inQuotes = false;
      const chars = text.trim();

      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];

        if (ch === '"') {
          // 雙引號跳脫
          if (inQuotes && chars[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          if (!rows.length || rows[rows.length - 1].done) {
            rows.push({ cells: [current], done: false });
          } else {
            rows[rows.length - 1].cells.push(current);
          }
          current = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && chars[i + 1] === '\n') i++;
          if (!rows.length || rows[rows.length - 1].done) {
            rows.push({ cells: [current], done: true });
          } else {
            rows[rows.length - 1].cells.push(current);
            rows[rows.length - 1].done = true;
          }
          current = '';
        } else {
          current += ch;
        }
      }

      // 最後一筆
      if (current || (rows.length && !rows[rows.length - 1].done)) {
        if (!rows.length || rows[rows.length - 1].done) {
          rows.push({ cells: [current], done: true });
        } else {
          rows[rows.length - 1].cells.push(current);
        }
      }

      return rows.map(r => r.cells);
    }

    // ----- 讀取 Google Sheets 資料 -----
    async function fetchTools() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error('無法讀取 Google Sheets，請檢查網址是否正確、是否已發佈到網路。');

        const text = await response.text();
        const rows = parseCSV(text);

        // 第一行是標題，跳過
        const dataRows = rows.slice(1);

        // 轉換成物件，並且只保留「已完成」的項目
        allTools = dataRows
          .filter(row => {
            const status = (row[COL.STATUS] || '').trim();
            return status === '已完成';
          })
          .map(row => ({
            id: (row[COL.ID] || '').trim(),
            name: (row[COL.NAME] || '').trim(),
            category: (row[COL.CATEGORY] || '').trim() || '未分類',
            desc: (row[COL.DESC] || '').trim(),
            link: (row[COL.LINK] || '').trim(),
            prompt: (row[COL.PROMPT] || '').trim()
          }))
          // 有名稱，且「有連結」或「有 prompt」才顯示
          .filter(tool => tool.name && (tool.link || tool.prompt));

        // 產生分類標籤
        renderTags();

        // 顯示卡片
        renderCards();

        // 隱藏 loading
        loading.style.display = 'none';
        grid.style.display = 'grid';

      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = err.message;
      }
    }

    // ----- 產生分類標籤 -----
    function renderTags() {
      // 從資料中取得所有不重複的分類
      const categories = [...new Set(allTools.map(t => t.category))].sort();

      // 清空再重建（保留「全部」按鈕）
      tagsContainer.innerHTML = '<button class="tag active" data-category="all">全部</button>';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'tag';
        btn.dataset.category = cat;
        btn.textContent = cat;
        tagsContainer.appendChild(btn);
      });

      // 綁定點擊事件
      tagsContainer.querySelectorAll('.tag').forEach(btn => {
        btn.addEventListener('click', () => {
          // 切換 active 狀態
          tagsContainer.querySelectorAll('.tag').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          currentCategory = btn.dataset.category;
          renderCards();
        });
      });
    }

    // ----- 篩選邏輯 -----
    function getFilteredTools() {
      return allTools.filter(tool => {
        // 分類篩選
        const matchCategory = currentCategory === 'all' || tool.category === currentCategory;

        // 搜尋篩選（名稱 + 說明 + prompt 內文）
        const keyword = currentSearch.toLowerCase();
        const matchSearch = !keyword ||
          tool.name.toLowerCase().includes(keyword) ||
          tool.desc.toLowerCase().includes(keyword) ||
          tool.prompt.toLowerCase().includes(keyword);

        return matchCategory && matchSearch;
      });
    }

    // ----- 渲染卡片 -----
    function renderCards() {
      const filtered = getFilteredTools();

      // 更新計數
      toolCount.textContent = `${filtered.length} / ${allTools.length} 個工具`;

      if (filtered.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.style.display = 'grid';

      grid.innerHTML = filtered.map((tool, i) => {
        const inner = `
          <div class="card-title">${escapeHTML(tool.name)}</div>
          ${tool.desc ? `<div class="card-desc">${escapeHTML(tool.desc)}</div>` : ''}
          <div class="card-footer">
            <span class="card-category">${escapeHTML(tool.category)}</span>
            ${tool.link ? `
            <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M5 12h14m-7-7 7 7-7 7"/>
            </svg>` : `
            <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="11" height="11" rx="2"/>
              <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
            </svg>`}
          </div>`;
        const delay = `animation-delay: ${i * 0.05}s`;

        // 有連結 → 一般工具卡片，開新分頁
        if (tool.link) {
          return `<a class="card" href="${escapeHTML(tool.link)}" target="_blank" rel="noopener"
                     style="${delay}">${inner}</a>`;
        }
        // 沒連結、只有 prompt → Prompt 卡片，點開彈窗
        return `<button type="button" class="card card-prompt" data-prompt-index="${allTools.indexOf(tool)}"
                        style="${delay}"><span class="card-badge">Prompt</span>${inner}</button>`;
      }).join('');

      // 綁定 Prompt 卡片
      grid.querySelectorAll('.card-prompt').forEach(btn => {
        btn.addEventListener('click', () => openPrompt(allTools[btn.dataset.promptIndex]));
      });
    }

    // ----- Prompt 彈窗 -----
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const copyBtn = document.getElementById('copyBtn');
    let currentPrompt = '';

    function openPrompt(tool) {
      currentPrompt = tool.prompt;
      modalTitle.textContent = tool.name;
      modalBody.textContent = tool.prompt;
      copyBtn.textContent = '複製 prompt';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePrompt() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    modal.addEventListener('click', (e) => {
      // 點背景或關閉鈕才關；點內容區不關
      if (e.target === modal || e.target.closest('[data-close]')) closePrompt();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('open')) closePrompt();
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentPrompt);
        copyBtn.textContent = '✓ 已複製';
      } catch (err) {
        // 舊瀏覽器或非 HTTPS 環境的退路：選取文字讓使用者自己按 Ctrl+C
        const range = document.createRange();
        range.selectNodeContents(modalBody);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        copyBtn.textContent = '已選取，請按 Ctrl+C';
      }
      setTimeout(() => { copyBtn.textContent = '複製 prompt'; }, 2000);
    });

    // ----- HTML 跳脫（防止 XSS）-----
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ----- 搜尋功能 -----
    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderCards();
    });

    // ----- 啟動！-----
    fetchTools();
  </script>
</body>
</html>
